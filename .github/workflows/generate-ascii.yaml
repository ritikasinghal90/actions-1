name: Generate ASCII ArtWork

on: push

jobs:
  build-job:
    runs-on: ubuntu-latest
    steps:
      - name: Install Cowsay Program
        run: sudo apt-get install -y cowsay
      
      - name: Execute Cowsay Cmd
        run: cowsay -f dragon "Runfor your life.....I am DRAGON" > dragon.txt

      - name: Sleep For 30 Sec
        run: sleep 30

  test-job:
    runs-on: ubuntu-latest
    needs: [build-job]
    steps:
      - name: Sleep For 10 Sec
        run: sleep 10

      - name: Test File Exists
        run: grep -i 'dragon' dragon.txt

  deploy-job:
    runs-on: ubuntu-latest
    needs: [test-job]
    steps:
      - name: Read File
        run: cat dragon.txt

      - name: Deploy
        run: echo "Deploying..."